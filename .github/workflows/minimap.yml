name: Minimap fork
on:
  push:
    branches: [pr-minimap]
  pull_request:
    branches: [pr-minimap]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --bin herdr sidebar
      - run: cargo test --locked --bin herdr tab_bar_status
      - run: python3 -m unittest scripts.test_config_reference_check scripts.test_ui_hot_path_architecture
